spring.application.name=barberia
server.port=8095
spring.datasource.url=jdbc:sqlite:./data/barberia.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
application.security.jwt.secret-key=miClaveSecretaMuySeguraQueEsLoSuficientementeLarga
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=86400000

# Usuario administrador inicial. Solo se crea si no existe ningun usuario.
application.security.admin.usuario=${ADMIN_USUARIO:admin}
application.security.admin.password=${ADMIN_PASSWORD:admin123}
application.security.admin.nombre=${ADMIN_NOMBRE:Administrador}

# WhatsApp (opcional). Si no se define, la app arranca igual y solo se omite el envio.
wasenderapi.api-key=${WASENDER_API_KEY:}
wasenderapi.api-url=${WASENDER_API_URL:https://api.wasender.io/v1/messages}