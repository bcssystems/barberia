spring.application.name=barberia
server.port=8095
spring.datasource.url=jdbc:sqlite:./data/barberia.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
application.security.jwt.secret-key=miClaveSecretaMuySeguraQueEsLoSuficientementeLarga
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=86400000